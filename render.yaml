services:
  - type: web
    name: transaction-monitoring
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: COMPILOT_API_URL
        sync: false
      - key: COMPILOT_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: COMPILOT_TMS_WORKFLOW_ID
        sync: false
